[project]
name = "ygworker"
version = "0.1.0"
description = "YGinvest price/matching worker"
requires-python = ">=3.12"
dependencies = [
  "supabase>=2.9.0",
  "apscheduler>=3.10.4",
  "python-dotenv>=1.0.1",
  "structlog>=24.4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.4",
  "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
