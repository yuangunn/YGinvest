[project]
name = "ygworker"
version = "0.1.0"
description = "YGinvest price/matching worker"
requires-python = ">=3.12"
dependencies = [
  "supabase>=2.9.0",
  "apscheduler>=3.10.4",
  "python-dotenv>=1.0.1",
  "structlog>=24.4.0",
  "yfinance>=0.2.50",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "pandas-market-calendars>=4.4.0",
  "finance-datareader>=0.9.110",
  "pywebpush>=2.0.0",
  "scrapling[fetchers]>=0.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.4",
  "mypy>=1.13.0",
  "pytest-httpx>=0.35.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# scripts/는 일회성 admin 스크립트 (sys.stdout 재설정 등으로 import 순서 다름)
extend-exclude = ["scripts/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.uv]
package = false
